name: Synthetic validation

on:
  push:
    branches: [main, portfolio/jetson-cleanup, portfolio/jetson-publication-prep]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless:
    # Pin the OS family; GitHub still updates the hosted image within 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-sim.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m tests.test_fusion
      - run: python -m tests.smoke_sim
  gui-simulation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-sim.txt
            requirements-ui.txt
      - run: python -m pip install -r requirements-ui.txt
      - run: python -m tests.gui_sim
